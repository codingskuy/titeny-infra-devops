# CI web Bun + SvelteKit (TTN-OPS-002).
name: ci-web
on:
  workflow_call:
    inputs:
      repository: { type: string, default: '' }
      ref: { type: string, default: '' }
    secrets:
      CI_CHECKOUT_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      repository: { type: string, default: 'Coding-Skuy/titeny-web' }
      ref: { type: string, default: 'main' }

permissions:
  contents: read

concurrency:
  group: ci-web-${{ inputs.repository || github.repository }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  bun-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: Coding-Skuy/titeny-infra-devops
          path: .infra
          sparse-checkout: scripts
      - run: sh .infra/scripts/qa-gate.sh . web
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34
      - name: bun install (lockfile beku)
        run: bun install --frozen-lockfile
      - name: Cek tipe (svelte-check)
        run: bun run check
      - name: bun test
        run: bun test

  # Pact konsumen web: jalankan ulang uji kontrak, pastikan berkas pacts/ yang di-commit sinkron dengan klien
  # (provider memverifikasi berkas ini; lihat ci-backend job pact-provider). Butuh PR titeny-web #15.
  pact-konsumen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.CI_CHECKOUT_TOKEN || github.token }}
      - name: Cek skrip test:pact
        id: ada
        run: |
          if grep -q '"test:pact"' package.json 2>/dev/null; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pact konsumen::skrip test:pact belum ada di package.json (menunggu titeny-web #15); dilewati"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.ada.outputs.ada == 'true'
        with:
          bun-version: 1.1.34
      - name: bun install (lockfile beku)
        if: steps.ada.outputs.ada == 'true'
        run: bun install --frozen-lockfile
      - name: Uji kontrak konsumen
        if: steps.ada.outputs.ada == 'true'
        run: bun run test:pact
      - name: Berkas pact tidak berubah setelah uji (kontrak ter-commit sinkron)
        if: steps.ada.outputs.ada == 'true'
        run: git diff --exit-code -- pacts/ || { echo "::error::pacts/ berubah setelah uji; jalankan bun run test:pact lalu commit"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.ada.outputs.ada == 'true'
        with:
          name: pact-web
          path: pacts/
          if-no-files-found: warn
