# Dinonaktifkan sebagai penjadwal (TTN-OPS-003): jadwal terkunci v1.0.0 (WIB) dijalankan oleh
# CronJob Kubernetes (k8s/cronjob-insight.yaml, timeZone Asia/Jakarta). Jadwal UTC lama
# (0 1 * * * dan 15 * * * *) dihapus agar tidak ada job ganda. Workflow ini hanya pemicu manual darurat.
name: scheduled-insight
on:
  workflow_dispatch:
    inputs:
      jenis:
        description: 'harga | demand | panen | mape'
        required: true
        type: choice
        options: [harga, demand, panen, mape]
permissions:
  contents: read
jobs:
  manual:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Pemicu manual untuk job ${{ inputs.jenis }}: jalankan lewat 'kubectl create job --from=cronjob/<nama> -n titeny' (lihat docs/runbook-job-terjadwal.md)."
