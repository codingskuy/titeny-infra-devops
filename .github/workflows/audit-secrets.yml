# Audit rahasia dan read-only (TTN-OPS-004): uji skrip + pindai rahasia ter-commit.
# Tidak memakai secrets apa pun; semua nilai uji palsu.
name: audit-secrets
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 23 * * 0'   # Senin 06.00 WIB
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pindai rahasia ter-commit
        run: sh scripts/scan-rahasia.sh .
      - name: Uji skrip secrets dan audit
        run: sh scripts/tests/secrets-test.sh
      - name: Uji SQL read-only pada Postgres sementara
        run: |
          pgbin=$(find /usr/lib/postgresql -maxdepth 2 -name bin -type d | sort -V | tail -n1)
          export PATH="$pgbin:$PATH"
          sh scripts/tests/sql-readonly-test.sh
